<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #141417;
      --border: rgba(255,255,255,0.07);
      --accent: #c9a96e;
      --accent-glow: rgba(201,169,110,0.18);
      --text: #f0ede8;
      --muted: #7a7672;
      --error: #e07070;
      --input-bg: rgba(255,255,255,0.03);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 65%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      left: -20%;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100,120,200,0.05) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 24px;
      padding: 52px 44px 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 36px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 6px;
      color: var(--text);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
      letter-spacing: 0.02em;
    }

    .field {
      margin-bottom: 20px;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    .field:nth-child(1) { animation-delay: 0.1s; }
    .field:nth-child(2) { animation-delay: 0.18s; }
    .field:nth-child(3) { animation-delay: 0.26s; }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
    }

    input::placeholder { color: rgba(122,118,114,0.5); }

    input:focus {
      border-color: var(--accent);
      background: rgba(201,169,110,0.03);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input.error { border-color: var(--error); }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }

    .hint {
      font-size: 11px;
      color: var(--error);
      margin-top: 6px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .hint.show { opacity: 1; transform: none; }

    .strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-bar {
      flex: 1;
      height: 2px;
      background: var(--border);
      transition: background 0.4s;
    }
    .strength-bar.weak   { background: var(--error); }
    .strength-bar.medium { background: #e0b970; }
    .strength-bar.strong { background: #7ecf9a; }

    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0f;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s;
      border-radius: 0;
      animation: fadeUp 0.7s 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      animation: fadeUp 0.7s 0.42s cubic-bezier(0.22,1,0.36,1) both;
    }
    .login-link a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .login-link a:hover { border-color: var(--accent); }

    /* Success state */
    .success-screen {
      display: none;
      text-align: center;
      padding: 12px 0;
    }
    .check-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check-icon svg { stroke: var(--accent); }
    .success-screen h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .success-screen p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-view">
      <div class="logo">Ваш Сайт</div>
      <h1>Создать аккаунт</h1>
      <p class="subtitle">Заполните данные для регистрации</p>

      <div class="field">
        <label for="name">Имя</label>
        <div class="input-wrap">
          <input type="text" id="name" placeholder="Иван Иванов" autocomplete="name" />
        </div>
        <div class="hint" id="name-hint">Введите ваше имя</div>
      </div>

      <div class="field">
        <label for="email">Электронная почта</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email" />
        </div>
        <div class="hint" id="email-hint">Введите корректный e-mail</div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Минимум 8 символов" autocomplete="new-password" />
          <button class="toggle-pw" type="button" id="toggle-pw" aria-label="Показать пароль">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength" id="strength-bars">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
          <div class="strength-bar" id="bar4"></div>
        </div>
        <div class="hint" id="pw-hint">Пароль слишком короткий</div>
      </div>

      <button class="btn" id="submit-btn" type="button">Зарегистрироваться</button>

      <div class="login-link">Уже есть аккаунт? <a href="#">Войти</a></div>
    </div>

    <div class="success-screen" id="success-view">
      <div class="check-icon">
        <svg width="24" height="24" fill="none" stroke-width="1.8" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Добро пожаловать!</h2>
      <p>Аккаунт успешно создан.<br/>Проверьте почту для подтверждения.</p>
    </div>
  </div>

  <script>
    const nameEl   = document.getElementById('name');
    const emailEl  = document.getElementById('email');
    const pwEl     = document.getElementById('password');
    const btn      = document.getElementById('submit-btn');
    const togglePw = document.getElementById('toggle-pw');

    // Show/hide password
    togglePw.addEventListener('click', () => {
      const isText = pwEl.type === 'text';
      pwEl.type = isText ? 'password' : 'text';
      document.getElementById('eye-icon').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });

    // Password strength
    pwEl.addEventListener('input', () => {
      const v = pwEl.value;
      let score = 0;
      if (v.length >= 8)  score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const cls = score <= 1 ? 'weak' : score <= 2 ? 'medium' : 'strong';
      ['bar1','bar2','bar3','bar4'].forEach((id, i) => {
        const bar = document.getElementById(id);
        bar.className = 'strength-bar';
        if (i < score) bar.classList.add(cls);
      });
    });

    function showHint(id, show) {
      const el = document.getElementById(id);
      el.classList.toggle('show', show);
    }
    function markError(input, hasError) {
      input.classList.toggle('error', hasError);
    }

    btn.addEventListener('click', () => {
      const name  = nameEl.value.trim();
      const email = emailEl.value.trim();
      const pw    = pwEl.value;

      const nameOk  = name.length >= 2;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const pwOk    = pw.length >= 8;

      markError(nameEl,  !nameOk);
      markError(emailEl, !emailOk);
      markError(pwEl,    !pwOk);
      showHint('name-hint',  !nameOk);
      showHint('email-hint', !emailOk);
      showHint('pw-hint',    !pwOk);

      if (nameOk && emailOk && pwOk) {
        btn.disabled = true;
        btn.textContent = 'Создаём аккаунт…';
        setTimeout(() => {
          document.getElementById('form-view').style.display = 'none';
          const sv = document.getElementById('success-view');
          sv.style.display = 'block';
          sv.style.animation = 'fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both';
        }, 800);
      }
    });
  </script>
</body>
</html>
